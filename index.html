<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetris</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tetris">
<meta name="theme-color" content="#111827">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: stretch;
    background: #111827;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #e5e7eb;
    box-sizing: border-box;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    box-sizing: border-box;
    padding-top: calc(4px + env(safe-area-inset-top));
    padding-bottom: calc(4px + env(safe-area-inset-bottom));
    padding-left: calc(6px + env(safe-area-inset-left));
    padding-right: calc(6px + env(safe-area-inset-right));
  }
  .wrap.swapped .toprow {
    flex-direction: row-reverse;
  }

  /* Top stats area: two stacked rows, content pushed right */
  .topbar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
  }
  .toprow {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 6px;
  }
  .btnrow {
    display: flex;
    flex-direction: row;
    gap: 6px;
    flex: 0 0 auto;
  }
  .box {
    background: #1f2937;
    border: 2px solid #374151;
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
  }
  .box.stat { flex: 0 0 auto; gap: 4px; min-width: 62px; }
  .spacer { flex: 1 1 auto; }
  .statline {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .statline .lbl {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9ca3af;
  }
  .statline .num {
    font-size: 17px;
    font-weight: bold;
    line-height: 1;
  }
  .statline.sub .num { font-size: 13px; color: #cbd5e1; }
  .box.next {
    flex: 0 0 auto;
    align-items: center;
    padding: 4px 6px;
  }
  #nextCanvas {
    background: #111827;
    border-radius: 4px;
    display: block;
    width: 52px;
    height: 34px;
  }
  .btncol {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
  }
  .tbtn {
    background: #374151;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    width: 44px;
    height: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .tbtn:active { background: #4f46e5; }

  /* Board fills remaining space, anchored to bottom */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  canvas#board {
    background: #1f2937;
    border: 3px solid #374151;
    border-radius: 6px;
    display: block;
    touch-action: none;
    box-sizing: border-box;
  }
  .controls-hint-desktop { display: none; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    border-radius: 6px;
    text-align: center;
    gap: 10px;
  }
  .stage {
    position: relative;
  }
  button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #6366f1; }

  #themeToast {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #themeToast.show { opacity: 1; }

  #versionBadge {
    align-self: flex-start;
    background: rgba(0,0,0,0.4);
    color: #6b7280;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    pointer-events: none;
    flex: 0 0 auto;
  }
  #infoBtn {
    align-self: flex-start;
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: #374151;
    color: #e5e7eb;
    font-size: 13px;
    font-weight: bold;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  #infoBtn:active { background: #4f46e5; }
  #infoModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #infoModal.show { display: flex; }
  .info-card {
    background: #1f2937;
    border: 2px solid #374151;
    border-radius: 12px;
    padding: 18px 20px;
    max-width: 320px;
    width: 100%;
    box-sizing: border-box;
  }
  .info-card h2 {
    margin: 0 0 12px 0;
    font-size: 18px;
    text-align: center;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    padding: 5px 0;
    color: #e5e7eb;
  }
  .info-row span:last-child { color: #93c5fd; font-weight: bold; white-space: nowrap; }
  .info-sep { height: 1px; background: #374151; margin: 8px 0; }
  .info-note {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 12px;
    line-height: 1.5;
  }
  #infoClose {
    margin-top: 16px;
    width: 100%;
    background: #4f46e5;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  #infoClose:active { background: #6366f1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="toprow">
      <div id="versionBadge">v34</div>
      <button id="infoBtn" aria-label="Scoring info">?</button>
      <div class="spacer"></div>
      <div class="box stat">
        <div class="statline"><span class="lbl">Score</span><span class="num" id="score">0</span></div>
        <div class="statline sub"><span class="lbl">Best</span><span class="num" id="best">0</span></div>
      </div>
      <div class="box stat">
        <div class="statline"><span class="lbl">Lines</span><span class="num" id="lines">0</span></div>
        <div class="statline sub"><span class="lbl">Level</span><span class="num" id="level">1</span></div>
      </div>
    </div>
    <div class="toprow">
      <div class="spacer"></div>
      <div class="box next">
        <canvas id="nextCanvas" width="120" height="80"></canvas>
      </div>
      <div class="btnrow">
        <button class="tbtn" id="btnSwap">⇄</button>
        <button class="tbtn" id="btnPause">⏸</button>
      </div>
    </div>
  </div>
  <div class="stage">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="themeToast"></div>
    <div id="overlay">
      <div id="overlayText" style="font-size:24px;font-weight:bold;">Paused</div>
      <div id="overlayScores" style="font-size:13px;line-height:1.7;color:#d1d5db;margin:4px 0;"></div>
      <button id="overlayBtn">Resume</button>
    </div>
  </div>
  <div id="infoModal">
    <div class="info-card">
      <h2>Scoring</h2>
      <div class="info-row"><span>Single line</span><span>100 × level</span></div>
      <div class="info-row"><span>Double</span><span>300 × level</span></div>
      <div class="info-row"><span>Triple</span><span>500 × level</span></div>
      <div class="info-row"><span>Tetris (4 lines)</span><span>800 × level</span></div>
      <div class="info-row"><span>Soft drop</span><span>1 / row</span></div>
      <div class="info-row"><span>Hard drop</span><span>2 / row</span></div>
      <div class="info-sep"></div>
      <div class="info-row"><span>Level up</span><span>every 10 lines</span></div>
      <div class="info-note">Higher level = faster fall + bigger score multiplier. Themes change every 500 points and loop.</div>
      <button id="infoClose">Got it</button>
    </div>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20, SIZE = 30;
const canvas = document.getElementById('board');
const nextCanvas = document.getElementById('nextCanvas');
const nctx = nextCanvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlayBtn = document.getElementById('overlayBtn');

const THEMES = [
  // Classic multicolor beveled
  { name: 'Classic', bg: '#1f2937', style: 'bevel', anim: 'flash', colors: { I: '#22d3ee', J: '#3b82f6', L: '#f97316', O: '#facc15', S: '#22c55e', T: '#a855f7', Z: '#ef4444' } },
  // Neon glow, saturated multicolor
  { name: 'Neon', bg: '#0f0524', style: 'glow', anim: 'pulse', colors: { I: '#00fff5', J: '#2d7bff', L: '#ff9100', O: '#faff00', S: '#00ff85', T: '#e000ff', Z: '#ff003c' } },
  // Monochrome green (matrix / terminal)
  { name: 'Matrix', bg: '#000000', style: 'glow', anim: 'pulse', colors: { I: '#39ff14', J: '#2fdd0f', L: '#7fff5e', O: '#b6ff9e', S: '#1fa806', T: '#5eff3a', Z: '#0f8a00' } },
  // Hot magenta/cyan high-contrast on black (synthwave)
  { name: 'Synthwave', bg: '#0d0221', style: 'glow', anim: 'sweep', colors: { I: '#00e5ff', J: '#0077ff', L: '#ff2ec4', O: '#ffd300', S: '#00ffa3', T: '#b026ff', Z: '#ff2a6d' } },
  // Chrome / metallic monochrome
  { name: 'Chrome', bg: '#0a0a0a', style: 'chrome', anim: 'shimmer', colors: { I: '#f3f4f6', J: '#9ca3af', L: '#d1d5db', O: '#e5e7eb', S: '#a1a1aa', T: '#6b7280', Z: '#4b5563' } },
  // Molten lava, warm mono-ish
  { name: 'Molten', bg: '#1a0500', style: 'glow', anim: 'sweep', colors: { I: '#ffd166', J: '#ff6b35', L: '#f77f00', O: '#ffee32', S: '#ff9e00', T: '#e5383b', Z: '#c1121f' } },
  // Ice / crystal glass, cool tones
  { name: 'Ice', bg: '#020617', style: 'glass', anim: 'shatter', colors: { I: '#7dd3fc', J: '#60a5fa', L: '#a5f3fc', O: '#e0f2fe', S: '#38bdf8', T: '#818cf8', Z: '#0ea5e9' } },
  // Candy / vaporwave glass, pastel high-key
  { name: 'Candy', bg: '#2b0a3d', style: 'glass', anim: 'shatter', colors: { I: '#ff8fab', J: '#c77dff', L: '#ffb3c6', O: '#fff3b0', S: '#b8f2e6', T: '#e0aaff', Z: '#ff5d8f' } },
  // All-white mono, ultra high contrast on black
  { name: 'Mono', bg: '#000000', style: 'bevel', anim: 'flash', colors: { I: '#ffffff', J: '#e5e5e5', L: '#f5f5f5', O: '#ffffff', S: '#d4d4d4', T: '#ededed', Z: '#cccccc' } },
  // Amber CRT / retro arcade single-hue
  { name: 'Amber', bg: '#180f00', style: 'glow', anim: 'sweep', colors: { I: '#ffb000', J: '#ff9500', L: '#ffc233', O: '#ffd966', S: '#e8890c', T: '#ffbf47', Z: '#cc7a00' } },
  // Bold primary blocks on stark background (Bauhaus)
  { name: 'Bauhaus', bg: '#111111', style: 'bevel', anim: 'flash', colors: { I: '#e63946', J: '#1d3557', L: '#f1a208', O: '#fee440', S: '#2a9d8f', T: '#3a86ff', Z: '#e63946' } },
  // --- Neon-heavy ---
  { name: 'Cyberpunk', bg: '#05010a', style: 'glow', anim: 'pulse', colors: { I: '#00f0ff', J: '#0066ff', L: '#ff6a00', O: '#fee600', S: '#00ff9f', T: '#ff00a0', Z: '#ff1744' } },
  { name: 'Toxic', bg: '#0a1200', style: 'glow', anim: 'pulse', colors: { I: '#39ff14', J: '#00ff88', L: '#ccff00', O: '#f6ff00', S: '#7cff00', T: '#00ffcc', Z: '#afff00' } },
  { name: 'Blacklight', bg: '#0a0018', style: 'glow', anim: 'pulse', colors: { I: '#b388ff', J: '#7c4dff', L: '#e040fb', O: '#ea80fc', S: '#c77dff', T: '#9d00ff', Z: '#d500f9' } },
  { name: 'Laser', bg: '#12000a', style: 'glow', anim: 'sweep', colors: { I: '#ff0055', J: '#ff2d78', L: '#ff5e00', O: '#ffd000', S: '#ff0088', T: '#ff004c', Z: '#ff3caa' } },
  { name: 'Electric', bg: '#000814', style: 'glow', anim: 'pulse', colors: { I: '#00e5ff', J: '#2979ff', L: '#00b0ff', O: '#40c4ff', S: '#18ffff', T: '#448aff', Z: '#0091ea' } },
  // --- Monochrome ---
  { name: 'Deep Blue', bg: '#00040d', style: 'bevel', anim: 'flash', colors: { I: '#dbeafe', J: '#3b82f6', L: '#93c5fd', O: '#bfdbfe', S: '#60a5fa', T: '#2563eb', Z: '#1e40af' } },
  { name: 'Crimson', bg: '#0d0000', style: 'bevel', anim: 'flash', colors: { I: '#fecaca', J: '#ef4444', L: '#fca5a5', O: '#fee2e2', S: '#f87171', T: '#dc2626', Z: '#991b1b' } },
  { name: 'Gold', bg: '#0a0800', style: 'chrome', anim: 'shimmer', colors: { I: '#fff4c2', J: '#d4af37', L: '#ffe066', O: '#ffd700', S: '#e6be5a', T: '#b8860b', Z: '#8c6d1f' } },
  { name: 'Slate', bg: '#0a0c10', style: 'chrome', anim: 'shimmer', colors: { I: '#e2e8f0', J: '#94a3b8', L: '#cbd5e1', O: '#f1f5f9', S: '#64748b', T: '#475569', Z: '#334155' } },
  // --- Creative ---
  { name: 'Aurora', bg: '#001018', style: 'glass', anim: 'shatter', colors: { I: '#4ade80', J: '#22d3ee', L: '#a3e635', O: '#5eead4', S: '#34d399', T: '#818cf8', Z: '#c084fc' } },
  { name: 'Sakura', bg: '#1a0510', style: 'glass', anim: 'shatter', colors: { I: '#ffd7e6', J: '#ff8fb3', L: '#ffc2d4', O: '#fff0f5', S: '#ff9ec7', T: '#f06292', Z: '#ffb7c5' } }
];
const THEME_INTERVAL = 500; // points per theme change
let themeIndex = 0;
let lastThemeBand = 0;
let COLORS = THEMES[0].colors;

const SHAPES = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  T: [[1,0],[0,1],[1,1],[2,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]]
};

function rotate(cells) {
  // rotate around center approx (using bounding box)
  const maxX = Math.max(...cells.map(c=>c[0]));
  const maxY = Math.max(...cells.map(c=>c[1]));
  return cells.map(([x,y]) => [maxY - y, x]);
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const key = keys[Math.floor(Math.random()*keys.length)];
  return { key, cells: SHAPES[key].map(c=>[...c]), color: COLORS[key] };
}

function currentBg() {
  return THEMES[themeIndex].bg;
}

let grid, current, next, pos, score, lines, level, dropInterval, dropTimer, lastTime, running, paused, gameOver;

function initGame() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  score = 0; lines = 0; level = 1;
  lastThemeBand = 0;
  themeIndex = Math.floor(Math.random() * THEMES.length);
  COLORS = THEMES[themeIndex].colors;
  dropInterval = 800;
  current = randomPiece();
  next = randomPiece();
  pos = { x: 3, y: -1 };
  running = true; paused = false; gameOver = false;
  clearing = false; clearRows = [];
  scoreRecorded = false;
  userRotX = 0; userRotY = 0; userRotZ = 0;
  document.getElementById('overlayScores').innerHTML = '';
  updateStats();
  refreshBest();
  overlay.style.display = 'none';
}

// --- High score persistence (works when hosted, e.g. GitHub Pages) ---
const SCORE_KEY = 'tetrisHighScores';
function loadScores() {
  try { return JSON.parse(localStorage.getItem(SCORE_KEY)) || []; }
  catch (e) { return []; }
}
function saveScores(arr) {
  try { localStorage.setItem(SCORE_KEY, JSON.stringify(arr)); } catch (e) {}
}
function recordScore(s) {
  const arr = loadScores();
  arr.push({ score: s, date: new Date().toISOString().slice(0, 10) });
  arr.sort((a, b) => b.score - a.score);
  const top = arr.slice(0, 5);
  saveScores(top);
  return top;
}
function bestScore() {
  const arr = loadScores();
  return arr.length ? arr[0].score : 0;
}
function refreshBest() {
  document.getElementById('best').textContent = bestScore();
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
  checkTheme();
}

function checkTheme() {
  const band = Math.floor(score / THEME_INTERVAL);
  if (band !== lastThemeBand) {
    lastThemeBand = band;
    // pick a random theme different from the current one
    let idx = themeIndex;
    if (THEMES.length > 1) {
      while (idx === themeIndex) idx = Math.floor(Math.random() * THEMES.length);
    }
    themeIndex = idx;
    COLORS = THEMES[themeIndex].colors;
    current.color = COLORS[current.key];
    next.color = COLORS[next.key];
    showThemeToast(THEMES[themeIndex].name);
  }
}

let toastTimer = null;
function showThemeToast(name) {
  const toast = document.getElementById('themeToast');
  toast.textContent = 'Theme: ' + name + '!';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

function collide(cells, ox, oy) {
  for (const [cx, cy] of cells) {
    const x = cx + ox, y = cy + oy;
    if (x < 0 || x >= COLS || y >= ROWS) return true;
    if (y >= 0 && grid[y][x]) return true;
  }
  return false;
}

function merge() {
  for (const [cx, cy] of current.cells) {
    const x = cx + pos.x, y = cy + pos.y;
    if (y >= 0) grid[y][x] = current.color;
  }
}

function getFullRows() {
  const rows = [];
  for (let y = 0; y < ROWS; y++) {
    if (grid[y].every(cell => cell)) rows.push(y);
  }
  return rows;
}

let clearing = false, clearRows = [], clearCount = 0, clearStart = 0, clearDuration = 0;

function startClear(rows) {
  clearing = true;
  clearRows = rows.slice();
  clearCount = rows.length;
  clearStart = performance.now();
  clearDuration = clearCount >= 4 ? 430 : clearCount === 3 ? 320 : 190;
}

function finishClear() {
  const cleared = clearRows.length;
  const clearSet = new Set(clearRows);
  const kept = grid.filter((_, y) => !clearSet.has(y));
  grid.length = 0;
  const pad = ROWS - kept.length;
  for (let i = 0; i < pad; i++) grid.push(Array(COLS).fill(null));
  for (const row of kept) grid.push(row);

  const points = [0, 100, 300, 500, 800][cleared] * level;
  score += points;
  lines += cleared;
  level = Math.floor(lines / 10) + 1;
  dropInterval = Math.max(100, 800 - (level - 1) * 70);

  clearing = false;
  clearRows = [];
  spawn();
  updateStats();
}

function spawn() {
  current = next;
  next = randomPiece();
  pos = { x: 3, y: -1 };
  if (collide(current.cells, pos.x, pos.y)) {
    gameOver = true;
    running = false;
    endGame();
  }
}

let scoreRecorded = false;
function endGame() {
  const prevBest = bestScore();
  let top = loadScores();
  if (!scoreRecorded) {
    top = recordScore(score);
    scoreRecorded = true;
  }
  const isRecord = score > 0 && score >= (top[0] ? top[0].score : 0) && score > prevBest;
  overlayText.textContent = isRecord ? 'New Best! ' + score : 'Game Over — ' + score;
  const rows = top.map((e, i) => {
    const mark = (e.score === score && i === top.findIndex(x => x.score === score)) ? ' ◄' : '';
    return (i + 1) + '. ' + e.score + mark;
  }).join('<br>');
  document.getElementById('overlayScores').innerHTML =
    '<div style="margin-top:6px;font-weight:bold;color:#9ca3af;">TOP SCORES</div>' + rows;
  overlayBtn.textContent = 'Restart';
  overlay.style.display = 'flex';
  refreshBest();
}

function hardDrop() {
  if (clearing) return;
  while (!collide(current.cells, pos.x, pos.y + 1)) {
    pos.y++;
    score += 2;
  }
  lockPiece();
}

function lockPiece() {
  merge();
  const full = getFullRows();
  if (full.length > 0) {
    startClear(full);
  } else {
    spawn();
    updateStats();
  }
}

function move(dx) {
  if (clearing) return;
  if (!collide(current.cells, pos.x + dx, pos.y)) pos.x += dx;
}

function softDrop() {
  if (clearing) return;
  if (!collide(current.cells, pos.x, pos.y + 1)) {
    pos.y++;
    score += 1;
    updateStats();
  } else {
    lockPiece();
  }
}

function tryRotate() {
  if (clearing) return;
  const rotated = rotate(current.cells);
  // normalize to avoid negative coords
  const minX = Math.min(...rotated.map(c=>c[0]));
  const minY = Math.min(...rotated.map(c=>c[1]));
  const norm = rotated.map(([x,y]) => [x - minX, y - minY]);
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collide(norm, pos.x + k, pos.y)) {
      current.cells = norm;
      pos.x += k;
      return;
    }
  }
}

function handleOrientation(e) {
  // gamma = left/right tilt in degrees (portrait). Positive = tilt right.
  let g = e.gamma || 0;
  g = Math.max(-45, Math.min(45, g));
  // liquid leans opposite to the tilt direction (gravity), scaled & clamped
  liquidTiltTarget = -(g * Math.PI / 180) * 0.8;
}

function enableTilt() {
  if (tiltReady) return;
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return;
  if (typeof DOE.requestPermission === 'function') {
    // iOS 13+ requires a permission request from a user gesture
    DOE.requestPermission().then((state) => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation);
        tiltReady = true;
      }
    }).catch(() => {});
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
    tiltReady = true;
  }
}
// request on the first user interaction (iOS gesture requirement)
window.addEventListener('touchend', enableTilt, { once: false });
window.addEventListener('click', enableTilt, { once: false });

// ============================================================
//  THREE.JS 3D BOARD RENDERER
// ============================================================
let renderer, scene, camera, boardGroup, envMap;
let cubePool = [], waterPool = [], surfPool = [];
let liquidTilt = 0, liquidTiltTarget = 0, tiltReady = false;
const CUBE_GEO = new THREE.BoxGeometry(0.88, 0.88, 0.88);
const WATER_GEO = new THREE.BoxGeometry(0.82, 1, 0.82);
const SURF_GEO = new THREE.BoxGeometry(0.84, 0.04, 0.84);
let backPanel, gridLines;

function hexToNum(hex) {
  let c = hex.replace('#','');
  if (c.length === 3) c = c.split('').map(ch=>ch+ch).join('');
  return parseInt(c, 16);
}

function makeEnvMap() {
  // procedural gradient environment for metallic reflections (mercury/chrome/gold)
  const c = document.createElement('canvas');
  c.width = 16; c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0.0, '#dfe8ff');
  grd.addColorStop(0.35, '#8aa0c0');
  grd.addColorStop(0.5, '#4b5a70');
  grd.addColorStop(0.65, '#222a38');
  grd.addColorStop(1.0, '#05070c');
  g.fillStyle = grd;
  g.fillRect(0, 0, 16, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromEquirectangular(tex);
  tex.dispose();
  pmrem.dispose();
  return rt.texture;
}

function makeCubeMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0xffffff, metalness: 0.1, roughness: 0.5,
    transparent: true, opacity: 1, envMap: envMap, envMapIntensity: 1
  });
}
function makeWaterMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0x3399ff, metalness: 0, roughness: 0.15,
    transparent: true, opacity: 0.82
  });
}
function makeSurfMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.1,
    transparent: true, opacity: 0.9, emissive: 0x111111
  });
}

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(46, 0.5, 0.1, 200);
  camera.position.set(0, 0, 27);
  camera.lookAt(0, 0, 0);

  boardGroup = new THREE.Group();
  boardGroup.rotation.x = 0.2;      // tilt forward a bit
  scene.add(boardGroup);

  // lighting — kept moderate so colors stay saturated and faces show shading
  scene.add(new THREE.AmbientLight(0xffffff, 0.32));
  const key = new THREE.DirectionalLight(0xffffff, 0.62);
  key.position.set(6, 12, 14);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x99bbff, 0.32);
  rim.position.set(-8, 4, 6);
  scene.add(rim);
  const fill = new THREE.PointLight(0xffffff, 0.22, 100);
  fill.position.set(0, 0, 18);
  scene.add(fill);

  envMap = makeEnvMap();

  // back panel for depth + faint column guides (kept very dark for contrast)
  const panelMat = new THREE.MeshStandardMaterial({ color: 0x04060a, metalness: 0.2, roughness: 0.95 });
  backPanel = new THREE.Mesh(new THREE.PlaneGeometry(COLS + 0.4, ROWS + 0.4), panelMat);
  backPanel.position.z = -0.6;
  boardGroup.add(backPanel);

  const linePts = [];
  for (let i = 1; i < COLS; i++) {
    const x = i - COLS / 2;
    linePts.push(new THREE.Vector3(x, ROWS / 2, -0.55), new THREE.Vector3(x, -ROWS / 2, -0.55));
  }
  for (let j = 1; j < ROWS; j++) {
    const y = j - ROWS / 2;
    linePts.push(new THREE.Vector3(-COLS / 2, y, -0.55), new THREE.Vector3(COLS / 2, y, -0.55));
  }
  const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
  gridLines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06 }));
  boardGroup.add(gridLines);

  // pools
  for (let i = 0; i < COLS * ROWS + 8; i++) {
    const cube = new THREE.Mesh(CUBE_GEO, makeCubeMaterial());
    cube.visible = false;
    boardGroup.add(cube);
    cubePool.push(cube);

    const water = new THREE.Mesh(WATER_GEO, makeWaterMaterial());
    water.visible = false;
    boardGroup.add(water);
    waterPool.push(water);

    const surf = new THREE.Mesh(SURF_GEO, makeSurfMaterial());
    surf.visible = false;
    boardGroup.add(surf);
    surfPool.push(surf);
  }
}

// gather all visible cells (locked grid + active piece) as {x,y,color,clearing}
function collectCells() {
  const cells = [];
  const clearSet = clearing ? new Set(clearRows) : null;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x]) cells.push({ x, y, color: grid[y][x], clr: clearSet ? clearSet.has(y) : false });
    }
  }
  if (!clearing) {
    for (const [cx, cy] of current.cells) {
      const x = cx + pos.x, y = cy + pos.y;
      if (y >= 0) cells.push({ x, y, color: current.color, clr: false });
    }
  }
  return cells;
}

function renderBoard3D(time) {
  if (!renderer) return;
  const theme = THEMES[themeIndex];
  const style = theme.style;
  // darken the background well below block brightness for strong contrast
  const bg = new THREE.Color(hexToNum(theme.bg));
  bg.multiplyScalar(0.32);
  scene.background = bg;

  // smoothly ease the liquid tilt toward the device-orientation target
  liquidTilt += (liquidTiltTarget - liquidTilt) * 0.1;

  const clearP = clearing ? Math.min(1, (performance.now() - clearStart) / clearDuration) : 0;
  const cells = collectCells();
  let ci = 0;

  for (const cell of cells) {
    const px = cell.x - (COLS - 1) / 2;
    const py = (ROWS - 1) / 2 - cell.y;
    const colNum = hexToNum(cell.color);
    const cube = cubePool[ci];
    const water = waterPool[ci];
    const surf = surfPool[ci];
    cube.visible = true;
    cube.position.set(px, py, 0);
    cube.rotation.set(0, 0, 0);
    cube.scale.set(1, 1, 1);
    const m = cube.material;
    m.color.setHex(colNum);
    m.emissive.setHex(0x000000);
    m.emissiveIntensity = 1;
    m.opacity = 1;
    water.visible = false;
    surf.visible = false;

    if (style === 'chrome') {
      // liquid mercury / polished metal
      m.metalness = 1.0;
      m.roughness = 0.12;
      m.envMapIntensity = 1.4;
    } else if (style === 'glow') {
      // neon: emissive with a gentle pulse (kept in range so it doesn't blow out)
      m.metalness = 0.0;
      m.roughness = 0.5;
      m.color.setHex(colNum);
      m.emissive.setHex(colNum);
      m.emissiveIntensity = 0.45 + 0.15 * Math.sin(time * 0.004 + cell.x + cell.y);
    } else if (style === 'glass') {
      // translucent box ~75% full of wobbling water that responds to phone tilt
      m.metalness = 0.0;
      m.roughness = 0.08;
      m.opacity = 0.18;
      const f = 0.75 + 0.05 * Math.sin(time * 0.003 + cell.x * 0.7 + cell.y * 0.5);
      water.visible = true;
      water.material.color.setHex(colNum);
      water.position.set(px, py - 0.46 * (1 - f), 0);
      water.scale.set(1, Math.max(0.05, f * 0.9), 1);
      water.rotation.z = liquidTilt;          // liquid leans with gravity as you tilt
      surf.visible = true;
      surf.material.color.setHex(colNum);
      surf.material.emissive.setHex(colNum);
      surf.material.emissiveIntensity = 0.4;
      surf.position.set(px, py - 0.46 * (1 - f) + f * 0.45, 0);
      surf.rotation.z = liquidTilt;           // surface line tilts to match
    } else {
      // bevel: matte plastic block
      m.metalness = 0.05;
      m.roughness = 0.72;
      m.envMapIntensity = 0.25;
    }

    // clear animation: cleared rows flash bright and pop
    if (cell.clr) {
      const pop = 1 + 0.25 * Math.sin(clearP * Math.PI);
      cube.scale.set(pop, pop, pop);
      m.emissive.setHex(0xffffff);
      m.emissiveIntensity = Math.sin(clearP * Math.PI) * (clearCount >= 4 ? 2.2 : 1.3);
      m.opacity = 1 - clearP * 0.3;
    }
    ci++;
  }
  for (let k = ci; k < cubePool.length; k++) {
    cubePool[k].visible = false;
    waterPool[k].visible = false;
    surfPool[k].visible = false;
  }

  // base tilt + user two-finger orbit + subtle idle sway
  boardGroup.rotation.x = BASE_TILT_X + userRotX;
  boardGroup.rotation.y = userRotY + 0.05 * Math.sin(time * 0.0004);
  boardGroup.rotation.z = userRotZ;
  renderer.render(scene, camera);
}



function shade(hex, amt) {
  // amt: -1..1, negative darkens, positive lightens
  let c = hex.replace('#','');
  if (c.length === 3) c = c.split('').map(ch=>ch+ch).join('');
  let r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const f = amt < 0 ? (v) => v * (1 + amt) : (v) => v + (255 - v) * amt;
  r = Math.max(0, Math.min(255, f(r)));
  g = Math.max(0, Math.min(255, f(g)));
  b = Math.max(0, Math.min(255, f(b)));
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawCell(c, x, y, color, size) {
  const s = size || SIZE;
  const px = x * s, py = y * s;
  const pad = 1;
  const w = s - pad, h = s - pad;
  const style = THEMES[themeIndex] ? THEMES[themeIndex].style : 'bevel';

  if (style === 'chrome') {
    const grad = c.createLinearGradient(px, py, px, py + h);
    grad.addColorStop(0, shade(color, 0.55));
    grad.addColorStop(0.35, shade(color, 0.05));
    grad.addColorStop(0.65, shade(color, -0.25));
    grad.addColorStop(1, shade(color, -0.55));
    c.fillStyle = grad;
    c.fillRect(px, py, w, h);
    c.strokeStyle = 'rgba(255,255,255,0.5)';
    c.lineWidth = 1;
    c.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
    // horizontal specular streak
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(px + 1, py + h * 0.15, w - 2, Math.max(1, h * 0.12));
  } else if (style === 'glass') {
    const grad = c.createLinearGradient(px, py, px + w, py + h);
    grad.addColorStop(0, shade(color, 0.35));
    grad.addColorStop(0.5, color);
    grad.addColorStop(1, shade(color, -0.3));
    c.fillStyle = grad;
    c.globalAlpha = 0.88;
    c.fillRect(px, py, w, h);
    c.globalAlpha = 1;
    // glossy highlight top-left triangle
    c.fillStyle = 'rgba(255,255,255,0.45)';
    c.beginPath();
    c.moveTo(px + 2, py + 2);
    c.lineTo(px + w * 0.6, py + 2);
    c.lineTo(px + 2, py + h * 0.6);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.3)';
    c.strokeRect(px + 0.5, py + 0.5, w - 1, h - 1);
  } else if (style === 'glow') {
    c.save();
    c.shadowColor = color;
    c.shadowBlur = size ? 4 : 10;
    c.fillStyle = shade(color, -0.1);
    c.fillRect(px, py, w, h);
    c.restore();
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.fillRect(px + 2, py + 2, w - 4, Math.max(1, h * 0.25));
    c.strokeStyle = shade(color, 0.4);
    c.lineWidth = 1.5;
    c.strokeRect(px + 0.75, py + 0.75, w - 1.5, h - 1.5);
  } else {
    // bevel (classic pseudo-3D block)
    c.fillStyle = color;
    c.fillRect(px, py, w, h);
    const bevel = Math.max(2, Math.round(s * 0.14));
    // top highlight
    c.fillStyle = shade(color, 0.45);
    c.beginPath();
    c.moveTo(px, py);
    c.lineTo(px + w, py);
    c.lineTo(px + w - bevel, py + bevel);
    c.lineTo(px + bevel, py + bevel);
    c.closePath();
    c.fill();
    // left highlight
    c.fillStyle = shade(color, 0.2);
    c.beginPath();
    c.moveTo(px, py);
    c.lineTo(px + bevel, py + bevel);
    c.lineTo(px + bevel, py + h - bevel);
    c.lineTo(px, py + h);
    c.closePath();
    c.fill();
    // bottom shadow
    c.fillStyle = shade(color, -0.35);
    c.beginPath();
    c.moveTo(px, py + h);
    c.lineTo(px + bevel, py + h - bevel);
    c.lineTo(px + w - bevel, py + h - bevel);
    c.lineTo(px + w, py + h);
    c.closePath();
    c.fill();
    // right shadow
    c.fillStyle = shade(color, -0.45);
    c.beginPath();
    c.moveTo(px + w, py);
    c.lineTo(px + w - bevel, py + bevel);
    c.lineTo(px + w - bevel, py + h - bevel);
    c.lineTo(px + w, py + h);
    c.closePath();
    c.fill();
  }
}

function draw() {
  // 2D next-piece preview (kept simple)
  nctx.fillStyle = '#111827';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  const cells = next.cells;
  const maxX = Math.max(...cells.map(c=>c[0]));
  const maxY = Math.max(...cells.map(c=>c[1]));
  const offX = (4 - (maxX+1)) / 2;
  const offY = (2 - (maxY+1)) / 2;
  for (const [cx, cy] of cells) {
    drawCell(nctx, cx + offX + 0.5, cy + offY + 0.5, next.color);
  }
  // 3D board is rendered every frame in the animation loop via renderBoard3D()
}

function gameLoop(time) {
  if (!lastTime) lastTime = time;
  const delta = time - lastTime;
  if (running && !paused) {
    if (clearing) {
      if (performance.now() - clearStart >= clearDuration) {
        finishClear();
      }
    } else {
      dropTimer = (dropTimer || 0) + delta;
      if (dropTimer > dropInterval) {
        dropTimer = 0;
        if (!collide(current.cells, pos.x, pos.y + 1)) {
          pos.y++;
        } else {
          lockPiece();
        }
      }
    }
    draw();
  }
  // always render the 3D scene so materials/water/reflections stay lively
  renderBoard3D(time);
  lastTime = time;
  requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) {
    overlayText.textContent = 'Paused';
    overlayBtn.textContent = 'Resume';
    overlay.style.display = 'flex';
  } else {
    overlay.style.display = 'none';
  }
}

document.addEventListener('keydown', (e) => {
  if (!running && e.code !== 'Space') return;
  if (paused && e.key.toLowerCase() !== 'p') return;
  switch (e.code) {
    case 'ArrowLeft': move(-1); draw(); break;
    case 'ArrowRight': move(1); draw(); break;
    case 'ArrowDown': softDrop(); draw(); break;
    case 'ArrowUp': tryRotate(); draw(); break;
    case 'Space': e.preventDefault(); if (running && !paused) { hardDrop(); draw(); } break;
    case 'KeyP': togglePause(); break;
  }
});

overlayBtn.addEventListener('click', () => {
  if (!running) {
    initGame();
  } else {
    togglePause();
  }
});

// --- Prevent iOS zoom gestures (pinch, double-tap) and text-selection callouts ---
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let lastTapTime = 0;

  const now = Date.now();

  lastTapTime = now;

// --- Touch controls ---
// Horizontal swipe: moves a number of columns proportional to how far you swipe
//   (short swipe = 1 column, longer swipe = more). Locked to horizontal once chosen.
// Vertical drag down: soft-drops in sync with your finger; releasing returns to normal fall.
// Big upward flick: hard drop. Quick tap: rotate.
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
let axisLock = null, lastDragY = 0, minDragDy = 0, colsMoved = 0;
const AXIS_LOCK_THRESHOLD = 8;
const HARD_DROP_SWIPE_UP = 55;
const H_STEP_PX = 22;  // finger travel that equals one column of horizontal movement

// --- Board orientation: base tilt + user orbit (two-finger) ---
const BASE_TILT_X = 0.2;
let userRotX = 0, userRotY = 0, userRotZ = 0;
let orbiting = false;
let orbitPrev = null;

function twoFingerInfo(t0, t1) {
  const cx = (t0.clientX + t1.clientX) / 2;
  const cy = (t0.clientY + t1.clientY) / 2;
  const ang = Math.atan2(t1.clientY - t0.clientY, t1.clientX - t0.clientX);
  return { cx, cy, ang };
}

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length >= 2) {
    orbiting = true;
    orbitPrev = twoFingerInfo(e.touches[0], e.touches[1]);
    return;
  }
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
  lastDragY = t.clientY;
  minDragDy = 0;
  maxDragDy = 0;
  colsMoved = 0;
  axisLock = null;
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  // two-finger orbit takes priority and works even when idle/paused
  if (orbiting || e.touches.length >= 2) {
    if (e.touches.length < 2) return;
    const info = twoFingerInfo(e.touches[0], e.touches[1]);
    if (orbitPrev) {
      userRotY += (info.cx - orbitPrev.cx) * 0.01;   // horizontal drag = spin
      userRotX += (info.cy - orbitPrev.cy) * 0.01;   // vertical drag = tilt
      let dAng = info.ang - orbitPrev.ang;
      if (dAng > Math.PI) dAng -= 2 * Math.PI;
      if (dAng < -Math.PI) dAng += 2 * Math.PI;
      userRotZ -= dAng;                               // twist = roll
      // clamp tilt so it can't flip fully upside down
      userRotX = Math.max(-1.2, Math.min(1.2, userRotX));
    }
    orbitPrev = info;
    renderBoard3D(performance.now());
    return;
  }
  if (!running || paused || clearing) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if (axisLock === null) {
    if (Math.abs(dx) < AXIS_LOCK_THRESHOLD && Math.abs(dy) < AXIS_LOCK_THRESHOLD) return;
    axisLock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }

  if (axisLock === 'x') {
    // target column count scales with swipe distance; step toward it one col at a time
    const targetCols = Math.trunc(dx / H_STEP_PX);
    while (colsMoved < targetCols) { move(1); colsMoved++; }
    while (colsMoved > targetCols) { move(-1); colsMoved--; }
    draw();
  } else {
    const rect = canvas.getBoundingClientRect();
    const cellPx = rect.width / COLS;
    minDragDy = Math.min(minDragDy, dy);
    maxDragDy = Math.max(maxDragDy, dy);
    while (t.clientY - lastDragY > cellPx) {
      if (!collide(current.cells, pos.x, pos.y + 1)) {
        pos.y++;
        score += 1;
        lastDragY += cellPx;
      } else {
        lockPiece();
        lastDragY = t.clientY;
        break;
      }
    }
    updateStats();
    draw();
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (orbiting) {
    // exit orbit once all fingers lift
    if (e.touches.length === 0) orbiting = false;
    orbitPrev = null;
    return;
  }
  if (!running || paused) return;
  const elapsed = Date.now() - touchStartTime;
  if (axisLock === null && elapsed < 250) {
    // quick tap = rotate
    tryRotate();
    draw();
  } else if (axisLock === 'y') {
    if (minDragDy < -HARD_DROP_SWIPE_UP) {
      // upward flick = hard drop
      hardDrop();
      draw();
    } else if (maxDragDy > 40 && (maxDragDy / Math.max(1, elapsed)) > 0.7) {
      // fast downward flick = hard drop (high velocity, decent distance)
      hardDrop();
      draw();
    }
  }
}, { passive: true });

// --- Fit the board to the largest size that fits the stage (keeps 1:2 ratio) ---
const stageEl = document.querySelector('.stage');
function fitBoard() {
  const availW = stageEl.clientWidth;
  const availH = stageEl.clientHeight;
  if (availW <= 0 || availH <= 0) return;
  const ratio = COLS / ROWS; // width / height = 0.5
  // fill the full height; if that overflows width, fall back to width
  let h = availH;
  let w = h * ratio;
  if (w > availW) {
    w = availW;
    h = w / ratio;
  }
  w = Math.floor(w); h = Math.floor(h);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  if (renderer) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

// ResizeObserver fires as soon as the stage has (or changes) its real size,
// which avoids the "measured too early" problem.
if (window.ResizeObserver) {
  const ro = new ResizeObserver(() => fitBoard());
  ro.observe(stageEl);
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', () => setTimeout(fitBoard, 100));

// initial idle state
grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
current = randomPiece();
next = randomPiece();
pos = { x: 3, y: -1 };
running = false;
initThree();
refreshBest();
fitBoard();
draw();
renderBoard3D(0);
overlayText.textContent = 'Tetris';
overlayBtn.textContent = 'Start';
overlay.style.display = 'flex';

// extra re-fits to catch late layout shifts (fonts, safe-area insets, dvh)
setTimeout(fitBoard, 100);
setTimeout(fitBoard, 400);
requestAnimationFrame(() => { fitBoard(); requestAnimationFrame(gameLoop); });
</script>
</body>
</html>
